name: Update data and publish

on:
  schedule:
    - cron: "30 0 * * *"        # every day 00:30 UTC = 07:30 Thailand time
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["template/**", "tools/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Pull newest samples from ThingsBoard
        run: python tools/update_data.py
      - name: Save new data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no new data"; else git commit -m "data: update $(date -u +%F)"; git pull --rebase -X theirs; git push; fi
      - name: Build the page
        run: python tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
